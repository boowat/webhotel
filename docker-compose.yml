services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-bookings-db
    environment:
      POSTGRES_DB: hotel_bookings
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_bookings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
